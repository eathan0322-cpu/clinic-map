<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新北市醫美戰情室 - 雙軌業務與即時搜尋版</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="醫美戰情室">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/854/854878.png">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    body { display: flex; height: 100vh; overflow: hidden; background: #0f172a; color: #f8fafc; }
    #sidebar { width: 420px; height: 100%; overflow-y: auto; background: #1e293b; padding: 18px; box-shadow: 2px 0 10px rgba(0,0,0,0.5); z-index: 1000; flex-shrink: 0; }
    #map { flex: 1; height: 100%; }
    
    /* 搜尋與篩選器控制面板 */
    .control-panel { background: #0f172a; padding: 14px; border-radius: 12px; margin-bottom: 14px; border: 1px solid #334155; }
    .search-box { position: relative; margin-bottom: 10px; }
    .search-input { width: 100%; padding: 9px 12px 9px 32px; background: #1e293b; border: 1px solid #475569; border-radius: 6px; color: white; font-size: 13px; }
    .search-input:focus { outline: none; border-color: #38bdf8; }
    .search-icon { position: absolute; left: 10px; top: 10px; font-size: 13px; color: #94a3b8; }
    
    .filter-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 6px; }
    .filter-select { width: 100%; padding: 7px 10px; background: #1e293b; border: 1px solid #475569; border-radius: 6px; color: white; font-size: 13px; font-weight: bold; cursor: pointer; }

    /* 戰情進度看板 */
    .dashboard { background: #0f172a; padding: 14px; border-radius: 12px; margin-bottom: 14px; border: 1px solid #334155; }
    .dash-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .dash-title { font-size: 12px; color: #94a3b8; }
    .dash-sync { font-size: 11px; padding: 2px 6px; border-radius: 4px; background: #065f46; color: #34d399; font-weight: bold; }
    .dash-score { font-size: 22px; font-weight: bold; color: #38bdf8; display: flex; align-items: baseline; gap: 6px; }
    .dash-score span { font-size: 12px; color: #64748b; font-weight: normal; }
    .progress-bar { width: 100%; height: 7px; background: #334155; border-radius: 4px; overflow: hidden; margin-top: 8px; display: flex; }
    .prog-yellow { background: #eab308; }
    .prog-orange { background: #f97316; }
    .prog-green { background: #22c55e; }
    .prog-purple { background: #a855f7; }
    .prog-red { background: #ef4444; }

    /* 表單區塊 */
    .form-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    h2 { font-size: 15px; color: #f1f5f9; border-left: 3px solid #38bdf8; padding-left: 8px; margin: 0; }
    .cancel-edit-btn { background: #475569; color: #cbd5e1; border: none; padding: 4px 8px; border-radius: 4px; font-size: 11px; cursor: pointer; display: none; }

    .form-group { margin-bottom: 9px; }
    label { display: block; font-size: 11px; color: #94a3b8; margin-bottom: 2px; }
    input, select, textarea { width: 100%; padding: 7px 9px; background: #334155; border: 1px solid #475569; border-radius: 6px; color: white; font-size: 13px; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #38bdf8; }
    button.btn-primary { width: 100%; padding: 10px; background: #2563eb; color: white; border: none; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer; transition: 0.2s; margin-top: 4px; }
    button.btn-primary:hover { background: #1d4ed8; }
    button.btn-update { background: #16a34a !important; }
    button:disabled { background: #64748b; cursor: not-allowed; }

    /* 圖例說明 */
    .legend { margin-top: 14px; border-top: 1px solid #334155; padding-top: 10px; font-size: 11px; }
    .legend-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-top: 6px; }
    .legend-item { display: flex; align-items: center; gap: 5px; color: #cbd5e1; }
    .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }

    /* 彈窗排版 */
    .leaflet-popup-content-wrapper { background: #1e293b; color: #f1f5f9; border-radius: 8px; }
    .leaflet-popup-tip { background: #1e293b; }
    .client-badge { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; margin-bottom: 4px; }
    .badge-prospect { background: #0369a1; color: #bae6fd; }
    .badge-existing { background: #854d0e; color: #fef08a; }
    .popup-btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-top: 8px; }
    .popup-btn { text-align: center; border: none; padding: 5px 3px; border-radius: 4px; font-size: 11px; font-weight: bold; cursor: pointer; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 3px; }

    @media (max-width: 768px) {
      body { flex-direction: column-reverse; }
      #sidebar { width: 100%; height: 50vh; }
      #map { height: 50vh; }
    }
  </style>
</head>
<body>

  <div id="sidebar">
    <!-- 搜尋與篩選 -->
    <div class="control-panel">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" class="search-input" placeholder="搜尋診所、地址或機台關鍵字..." oninput="handleSearch()">
      </div>
      <div class="filter-row">
        <div>
          <label>客群維度</label>
          <select id="clientTypeFilter" class="filter-select" onchange="applyFilters()">
            <option value="ALL">全部客戶群體</option>
            <option value="prospect">🎯 陌開客戶（主攻設備）</option>
            <option value="existing">🤝 既有客戶（耗材/擴機）</option>
          </select>
        </div>
        <div>
          <label>行政責任轄區</label>
          <select id="districtFilter" class="filter-select" onchange="applyFilters(true)">
            <option value="ALL">🌐 新北市全區</option>
            <option value="板橋區">板橋區</option>
            <option value="新莊區">新莊區</option>
            <option value="中和區">中和區</option>
            <option value="永和區">永和區</option>
            <option value="三重區">三重區</option>
            <option value="蘆洲區">蘆洲區</option>
            <option value="土城區">土城區</option>
            <option value="新店區">新店區</option>
            <option value="林口區">林口區</option>
            <option value="淡水區">淡水區</option>
            <option value="汐止區">汐止區</option>
            <option value="三峽區">三峽區</option>
            <option value="鶯歌區">鶯歌區</option>
            <option value="樹林區">樹林區</option>
            <option value="泰山區">泰山區</option>
            <option value="五股區">五股區</option>
            <option value="八里區">八里區</option>
            <option value="其他">其他區域</option>
          </select>
        </div>
      </div>
    </div>

    <!-- 戰情儀表板 -->
    <div class="dashboard">
      <div class="dash-header">
        <div class="dash-title" id="currentScopeTitle">📍 板橋區戰情進度</div>
        <div class="dash-sync" id="syncStatus">🟢 雲端同步完成</div>
      </div>
      <div class="dash-score" id="totalCount">0 <span>家顯示中</span></div>
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <!-- 目標建檔與情報更新 -->
    <div class="form-header">
      <h2 id="formTitle">⚔️ 建立與維護目標</h2>
      <button type="button" id="cancelEditBtn" class="cancel-edit-btn" onclick="resetFormToCreate()">取消編輯</button>
    </div>

    <form id="clinicForm">
      <input type="hidden" id="editingId" value="">

      <div class="form-group">
        <label>客戶屬性</label>
        <select id="clientType">
          <option value="prospect">🎯 陌開客戶（主攻設備推展）</option>
          <option value="existing">🤝 既有客戶（耗材巡補 / 擴機需求）</option>
        </select>
      </div>

      <div class="form-group">
        <label>診所名稱</label>
        <input type="text" id="name" placeholder="例如：板橋光澤診所" required>
      </div>
      <div class="form-group">
        <label>診所地址</label>
        <input type="text" id="address" placeholder="例如：新北市板橋區館前東路2號" required>
      </div>
      <div class="form-group">
        <label>推進階段（戰情色號）</label>
        <select id="status">
          <option value="red">🔴 未探勘 / 迷霧防禦</option>
          <option value="yellow">🟡 初訪摸底（DM留置/競品盤點）</option>
          <option value="orange">🟠 鎖定對話（取得院長/店長窗口）</option>
          <option value="green">🟢 評估試機（DEMO/提報報價）</option>
          <option value="purple">🟣 合作結案（已成交/常態維護）</option>
        </select>
      </div>
      <div class="form-group">
        <label>現有機台 / 競品與耗材需求</label>
        <input type="text" id="equipment" placeholder="例如：海芙三代、玩美電波、探頭耗材量大">
      </div>
      <div class="form-group">
        <label>戰情情報與下一步策略</label>
        <textarea id="notes" rows="3" placeholder="例如：店長已換人，下週二預約提報新機台"></textarea>
      </div>
      <button type="submit" id="submitBtn" class="btn-primary">定位並同步至雲端</button>
    </form>

    <!-- 圖例說明 -->
    <div class="legend">
      <div style="font-weight: bold; margin-bottom: 4px; color:#94a3b8;">階段色標與圖例：</div>
      <div class="legend-grid">
        <div class="legend-item"><span class="dot" style="background: #ef4444;"></span> 🔴 未探勘/迷霧</div>
        <div class="legend-item"><span class="dot" style="background: #eab308;"></span> 🟡 初訪摸底</div>
        <div class="legend-item"><span class="dot" style="background: #f97316;"></span> 🟠 鎖定對話窗口</div>
        <div class="legend-item"><span class="dot" style="background: #22c55e;"></span> 🟢 評估試機/報價</div>
        <div class="legend-item"><span class="dot" style="background: #a855f7;"></span> 🟣 合作結案/維護</div>
        <div class="legend-item"><span style="display:inline-block; width:10px; height:10px; border:2px solid #facc15; border-radius:50%;"></span> 金框：既有客戶</div>
      </div>
    </div>
  </div>

  <div id="map"></div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAuYp6stsPabpFZKJsHnCEAlmyM8LAgC_Q",
      authDomain: "clinic-crm-3048c.firebaseapp.com",
      databaseURL: "https://clinic-crm-3048c-default-rtdb.firebaseio.com",
      projectId: "clinic-crm-3048c",
      storageBucket: "clinic-crm-3048c.firebasestorage.app",
      messagingSenderId: "288594212887",
      appId: "1:288594212887:web:c22ed957992fb722fe4452"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const clinicsRef = db.ref('clinics');

    // 新北全 29 區座標配置
    const districtCoords = {
      'ALL': { center: [25.012, 121.465], zoom: 12 },
      '板橋區': { center: [25.0135, 121.4645], zoom: 14 },
      '新莊區': { center: [25.0375, 121.4485], zoom: 14 },
      '中和區': { center: [24.9985, 121.5005], zoom: 14 },
      '永和區': { center: [25.0085, 121.5155], zoom: 15 },
      '三重區': { center: [25.0685, 121.4885], zoom: 14 },
      '蘆洲區': { center: [25.0855, 121.4725], zoom: 14 },
      '土城區': { center: [24.9725, 121.4435], zoom: 14 },
      '新店區': { center: [24.9685, 121.5415], zoom: 13 },
      '林口區': { center: [25.0785, 121.3715], zoom: 14 },
      '淡水區': { center: [25.1725, 121.4435], zoom: 13 },
      '汐止區': { center: [25.0655, 121.6565], zoom: 13 },
      '三峽區': { center: [24.9335, 121.3735], zoom: 13 },
      '鶯歌區': { center: [24.9545, 121.3555], zoom: 14 },
      '樹林區': { center: [24.9915, 121.4245], zoom: 14 },
      '泰山區': { center: [25.0585, 121.4315], zoom: 14 },
      '五股區': { center: [25.0835, 121.4385], zoom: 14 },
      '八里區': { center: [25.1485, 121.3985], zoom: 13 }
    };

    const colorMap = {
      red: '#ef4444',
      yellow: '#eab308',
      orange: '#f97316',
      green: '#22c55e',
      purple: '#a855f7'
    };

    let clinics = [];
    let currentDistrict = '板橋區';
    let currentClientType = 'ALL';
    let searchQuery = '';
    let markers = [];

    const map = L.map('map').setView([25.0135, 121.4645], 14);
    L.tileLayer('https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // 監聽 Firebase 雲端即時同步
    clinicsRef.on('value', (snapshot) => {
      const data = snapshot.val();
      if (data) {
        clinics = Object.values(data).map(item => ({
          ...item,
          clientType: item.clientType || 'prospect' // 預設歸類為陌開客戶
        }));
        renderMap();
        document.getElementById('syncStatus').innerText = '🟢 雲端同步完成';
      }
    });

    function detectDistrict(addr) {
      const districts = ['板橋區', '新莊區', '中和區', '永和區', '三重區', '蘆洲區', '土城區', '新店區', '林口區', '淡水區', '汐止區', '三峽區', '鶯歌區', '樹林區', '泰山區', '五股區', '八里區'];
      for (let d of districts) {
        if (addr.includes(d) || addr.includes(d.replace('區', ''))) return d;
      }
      return '其他';
    }

    function handleSearch() {
      searchQuery = document.getElementById('searchInput').value.trim().toLowerCase();
      renderMap();
    }

    function applyFilters(shouldFly = false) {
      currentDistrict = document.getElementById('districtFilter').value;
      currentClientType = document.getElementById('clientTypeFilter').value;
      renderMap();

      if (shouldFly && districtCoords[currentDistrict]) {
        map.flyTo(districtCoords[currentDistrict].center, districtCoords[currentDistrict].zoom, { duration: 1.2 });
      }
    }

    function renderMap() {
      markers.forEach(m => map.removeLayer(m));
      markers = [];

      const filtered = clinics.filter(item => {
        const matchDistrict = (currentDistrict === 'ALL') || (item.district === currentDistrict);
        const matchClient = (currentClientType === 'ALL') || (item.clientType === currentClientType);
        const matchSearch = !searchQuery || 
          (item.name && item.name.toLowerCase().includes(searchQuery)) ||
          (item.address && item.address.toLowerCase().includes(searchQuery)) ||
          (item.equipment && item.equipment.toLowerCase().includes(searchQuery)) ||
          (item.notes && item.notes.toLowerCase().includes(searchQuery));

        return matchDistrict && matchClient && matchSearch;
      });

      filtered.forEach(item => {
        const isExisting = item.clientType === 'existing';
        
        // 既有客戶使用金色粗邊框標示，陌開客戶使用純白邊框
        const marker = L.circleMarker([item.lat, item.lng], {
          radius: isExisting ? 13 : 11,
          fillColor: colorMap[item.status] || '#ef4444',
          color: isExisting ? '#facc15' : '#ffffff',
          weight: isExisting ? 3.5 : 2,
          opacity: 1,
          fillOpacity: 0.95
        }).addTo(map);

        const badgeClass = isExisting ? 'badge-existing' : 'badge-prospect';
        const badgeLabel = isExisting ? '🤝 既有客戶（耗材/擴機）' : '🎯 陌開客戶（設備拓展）';
        const gmapNavUrl = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(item.name + ' ' + item.address)}&travelmode=driving`;
        const gmapSearchUrl = `https://www.google.com/search?q=${encodeURIComponent(item.name + ' ' + (item.district || ''))}`;

        const popupContent = `
          <div style="font-size:13px; min-width: 220px;">
            <span class="client-badge ${badgeClass}">${badgeLabel}</span>
            <div style="font-size:11px; color:#38bdf8; font-weight:bold;">${item.district || '新北市'}</div>
            <strong style="font-size:15px;">${item.name}</strong><br>
            <span style="font-size:12px; color:#94a3b8;">${item.address || ''}</span><br>
            <b style="color:#38bdf8;">機台/耗材：</b>${item.equipment || '未註明'}<br>
            <b style="color:#38bdf8;">戰情：</b>${item.notes || '無'}<br>
            
            <div class="popup-btn-row">
              <button class="popup-btn" onclick="startEditClinic('${item.id}')" style="background:#2563eb; color:white;">✏️ 編輯情報</button>
              <a class="popup-btn" href="${gmapSearchUrl}" target="_blank" style="background:#475569; color:white;">🔍 Google 查核</a>
              <a class="popup-btn" href="${gmapNavUrl}" target="_blank" style="background:#0284c7; color:white;">🚗 店家導航</a>
              <button class="popup-btn" onclick="deleteClinic('${item.id}')" style="background:#ef4444; color:white;">🗑️ 刪除標記</button>
            </div>
          </div>
        `;
        marker.bindPopup(popupContent);
        markers.push(marker);
      });

      updateStats(filtered);
    }

    function updateStats(filteredList) {
      const scopeName = currentDistrict === 'ALL' ? '新北市全區' : currentDistrict;
      document.getElementById('currentScopeTitle').innerText = `📍 ${scopeName} 戰情進度`;
      document.getElementById('totalCount').innerHTML = `${filteredList.length} <span>家顯示中</span>`;
      
      const bar = document.getElementById('progressBar');
      bar.innerHTML = '';
      if (filteredList.length === 0) return;

      const counts = { red: 0, yellow: 0, orange: 0, green: 0, purple: 0 };
      filteredList.forEach(c => counts[c.status] = (counts[c.status] || 0) + 1);

      for (let s in counts) {
        if (counts[s] > 0) {
          const seg = document.createElement('div');
          seg.className = `prog-${s}`;
          seg.style.width = `${(counts[s] / filteredList.length) * 100}%`;
          bar.appendChild(seg);
        }
      }
    }

    window.startEditClinic = function(id) {
      const target = clinics.find(c => c.id === id);
      if (!target) return;

      document.getElementById('editingId').value = target.id;
      document.getElementById('clientType').value = target.clientType || 'prospect';
      document.getElementById('name').value = target.name;
      document.getElementById('address').value = target.address;
      document.getElementById('status').value = target.status;
      document.getElementById('equipment').value = target.equipment || '';
      document.getElementById('notes').value = target.notes || '';

      document.getElementById('formTitle').innerText = `✏️ 編輯：${target.name}`;
      document.getElementById('cancelEditBtn').style.display = 'block';

      const submitBtn = document.getElementById('submitBtn');
      submitBtn.innerText = '💾 儲存並同步至雲端';
      submitBtn.classList.add('btn-update');

      document.getElementById('sidebar').scrollTop = 160;
    };

    window.resetFormToCreate = function() {
      document.getElementById('editingId').value = '';
      document.getElementById('clinicForm').reset();
      document.getElementById('formTitle').innerText = '⚔️ 建立與維護目標';
      document.getElementById('cancelEditBtn').style.display = 'none';

      const submitBtn = document.getElementById('submitBtn');
      submitBtn.innerText = '定位並同步至雲端';
      submitBtn.classList.remove('btn-update');
    };

    document.getElementById('clinicForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const editingId = document.getElementById('editingId').value;
      const submitBtn = document.getElementById('submitBtn');
      const address = document.getElementById('address').value;
      const name = document.getElementById('name').value;
      const clientType = document.getElementById('clientType').value;
      const detectedDistrict = detectDistrict(address);

      if (editingId) {
        const target = clinics.find(c => c.id === editingId);
        if (target) {
          const updatedClinic = {
            ...target,
            clientType: clientType,
            name: name,
            address: address,
            district: detectedDistrict,
            status: document.getElementById('status').value,
            equipment: document.getElementById('equipment').value,
            notes: document.getElementById('notes').value
          };
          
          await clinicsRef.child(editingId).set(updatedClinic);
          map.closePopup();
          resetFormToCreate();
        }
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerText = '正在定位並儲存雲端...';

      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(address)}`);
        const data = await res.json();

        if (data && data.length > 0) {
          const newId = 'c_' + Date.now();
          const lat = parseFloat(data[0].lat);
          const lng = parseFloat(data[0].lon);

          const newClinic = {
            id: newId,
            clientType: clientType,
            district: detectedDistrict,
            name: name,
            address: address,
            lat: lat,
            lng: lng,
            status: document.getElementById('status').value,
            equipment: document.getElementById('equipment').value,
            notes: document.getElementById('notes').value
          };

          await clinicsRef.child(newId).set(newClinic);
          
          if (currentDistrict !== 'ALL' && currentDistrict !== detectedDistrict) {
            document.getElementById('districtFilter').value = detectedDistrict;
            currentDistrict = detectedDistrict;
          }

          map.setView([lat, lng], 16);
          e.target.reset();
        } else {
          alert('找不到這個地址，請確認有填寫新北市與行政區！');
        }
      } catch (err) {
        alert('連線失敗，請檢查網路連線。');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = '定位並同步至雲端';
      }
    });

    window.deleteClinic = function(id) {
      if (confirm('確定要從雲端永久移除這家診所嗎？')) {
        clinicsRef.child(id).remove();
      }
    };

    document.getElementById('districtFilter').value = '板橋區';
  </script>
</body>
</html>
