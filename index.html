      </div>

    function detectDistrict(addr) {
      if (addr.includes('基隆')) return '基隆市';
      const districts = ['板橋區', '新莊區', '中和區', '永和區', '三重區', '林口區', '蘆洲區', '土城區', '新店區', '淡水區', '汐止區', '三峽區', '鶯歌區', '樹林區', '泰山區', '五股區', '八里區'];
      for (let d of districts) {
        if (addr.includes(d) || addr.includes(d.replace('區', ''))) return d;
      }
      return '其他';
    }

    function handleSearch() {
      searchQuery = document.getElementById('searchInput').value.trim().toLowerCase();

      currentDistrict = document.getElementById('districtFilter').value;
      currentClientType = document.getElementById('clientTypeFilter').value;
      currentStatusFilter = document.getElementById('statusFilter').value;
      renderMap();

      if (shouldFly && districtCoords[currentDistrict]) {
        map.setView(districtCoords[currentDistrict].center, districtCoords[currentDistrict].zoom);
        setTimeout(() => map.invalidateSize(), 50);
      }
    }

    function quickFilterStatus(status) {
      document.getElementById('statusFilter').value = status;
      currentStatusFilter = status;
      renderMap();
    }

    window.setQuickDate = function(days) {
      const d = new Date();
      d.setDate(d.getDate() + days);
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      document.getElementById('followUpDate').value = `${yyyy}-${mm}-${dd}`;
    };

    window.handleClientTypeChange = function() {
      const clientType = document.getElementById('clientType').value;
      const statusGroup = document.getElementById('statusFormGroup');
      if (clientType === 'existing') {
        statusGroup.style.display = 'none';
      } else {
        statusGroup.style.display = 'block';
      }
    };

    function getFilteredClinics() {
      return clinics.filter(item => {
        const isExisting = item.clientType === 'existing';
        const matchDistrict = (currentDistrict === 'ALL') || (item.district === currentDistrict);
        const matchClient = (currentClientType === 'ALL') || (item.clientType === currentClientType);
        const matchStatus = isExisting ? true : ((currentStatusFilter === 'ALL') || (item.status === currentStatusFilter));
        
        const matchSearch = !searchQuery || 
          (item.name && item.name.toLowerCase().includes(searchQuery)) ||
          (item.address && item.address.toLowerCase().includes(searchQuery)) ||
          (item.equipment && item.equipment.toLowerCase().includes(searchQuery)) ||
          (item.notes && item.notes.toLowerCase().includes(searchQuery)) ||
          (item.lastVisitDate && item.lastVisitDate.includes(searchQuery)) ||
          (item.followUpDate && item.followUpDate.includes(searchQuery));

        return matchDistrict && matchClient && matchStatus && matchSearch;
      });
    }

    function renderMap() {
      markers.forEach(m => map.removeLayer(m));
      markers = [];

      const filtered = getFilteredClinics();

      filtered.forEach(item => {
        const isExisting = item.clientType === 'existing';
        let marker;

        if (isExisting) {
          // 高級曜石黑底 + 香檳金邊框 + 星芒徽章 ⭐
          const vipIcon = L.divIcon({
            className: 'vip-marker-wrap',
            html: `
              <div style="
                width: 26px; height: 26px;
                background: radial-gradient(circle at 30% 30%, #334155, #0f172a);
                border: 2px solid #eab308;
                border-radius: 50%;
                box-shadow: 0 2px 8px rgba(0,0,0,0.5), 0 0 10px rgba(234, 179, 8, 0.45);
                display: flex; align-items: center; justify-content: center;
                font-size: 13px; line-height: 1; color: #facc15;
              ">⭐</div>
            `,
            iconSize: [26, 26],
            iconAnchor: [13, 13]
          });
          marker = L.marker([item.lat, item.lng], { icon: vipIcon }).addTo(map);
        } else {
          // 陌開客戶：極簡俐落彩色圓點
          marker = L.circleMarker([item.lat, item.lng], {
            radius: 10,
            fillColor: colorMap[item.status] || '#ef4444',
            color: '#ffffff',
            weight: 2,
            opacity: 1,
            fillOpacity: 0.95
          }).addTo(map);
        }

        const badgeClass = isExisting ? 'badge-existing' : 'badge-prospect';
        const badgeLabel = isExisting ? '⭐ 既有客戶（常態巡護/擴機）' : '🎯 陌開客戶（設備拓展）';
        const gmapNavUrl = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(item.name + ' ' + item.address)}&travelmode=driving`;
        const gmapSearchUrl = `https://www.google.com/search?q=${encodeURIComponent(item.name + ' ' + (item.district || ''))}`;

        const lastVisitText = item.lastVisitDate ? `📅 上次拜訪：${item.lastVisitDate}` : '📅 上次拜訪：尚未記錄';
        const followUpText = item.followUpDate ? `🔔 預計複訪：${item.followUpDate}` : '';

        const popupContent = `
          <div style="font-size:13px; min-width: 220px;">
            <span class="client-badge ${badgeClass}">${badgeLabel}</span>
            <div style="font-size:11px; color:#38bdf8; font-weight:bold;">${item.district || '責任轄區'}</div>

              ${followUpText ? `<div style="color: #facc15; font-weight:bold; margin-top:2px;">${followUpText}</div>` : ''}

            <b style="color:#38bdf8;">機台/耗材：</b>${item.equipment || '未註明'}<br>
            <b style="color:#38bdf8;">戰情：</b>${item.notes || '無'}<br>

    function updateStats(filteredList) {
      const scopeName = currentDistrict === 'ALL' ? '全責任區' : currentDistrict;
      document.getElementById('currentScopeTitle').innerText = `📍 ${scopeName} 戰情進度`;
      document.getElementById('totalCount').innerHTML = `${filteredList.length} <span>家顯示中</span>`;
      
      const bar = document.getElementById('progressBar');
      bar.innerHTML = '';
      
      const prospectList = filteredList.filter(c => c.clientType !== 'existing');
      if (prospectList.length === 0) return;

      const counts = { red: 0, yellow: 0, orange: 0, green: 0, purple: 0 };
      prospectList.forEach(c => counts[c.status] = (counts[c.status] || 0) + 1);

      for (let s in counts) {
        if (counts[s] > 0) {
          const seg = document.createElement('div');
          seg.className = `prog-${s}`;
          seg.style.width = `${(counts[s] / prospectList.length) * 100}%`;
          seg.title = `陌開階段 (${counts[s]} 家)`;
          seg.onclick = (e) => {
            e.stopPropagation();
            quickFilterStatus(s);
          };
          bar.appendChild(seg);
        }
      }
    }

    window.exportToExcel = function() {
      const list = getFilteredClinics();
      if (list.length === 0) {
        alert('目前篩選條件下沒有任何診所可匯出！');
        return;
      }

      const rows = list.map(c => ({
        "責任轄區": c.district || "其他",
        "診所名稱": c.name || "",
        "客戶群體": c.clientType === 'existing' ? '⭐ 既有客戶(耗材/擴機)' : '🎯 陌開客戶(設備拓展)',
        "推進階段": c.clientType === 'existing' ? '常態巡護/擴機' : (statusNames[c.status] || c.status),
        "地址": c.address || "",
        "現有機台與耗材需求": c.equipment || "未註明",
        "最新情報備忘與策略": c.notes || "無",
        "上次拜訪日期": c.lastVisitDate || "未到訪",
        "預計複訪日期": c.followUpDate || "無"
      }));

      const worksheet = XLSX.utils.json_to_sheet(rows);
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, "醫美業務戰情報表");

      const dateTag = new Date().toISOString().slice(0, 10);
      const scopeTag = currentDistrict === 'ALL' ? '全責任區' : currentDistrict;
      XLSX.writeFile(workbook, `醫美業務戰情報表_${scopeTag}_${dateTag}.xlsx`);
    };

    window.exportToPPT = function() {
      const list = getFilteredClinics();
      if (list.length === 0) {
        alert('目前篩選條件下沒有任何診所可匯出簡報！');
        return;
      }

      const pptx = new PptxGenJS();
      pptx.layout = 'LAYOUT_16x9';

      const scopeTag = currentDistrict === 'ALL' ? '全責任區' : currentDistrict;
      const todayTag = new Date().toISOString().slice(0, 10);

      const cover = pptx.addSlide();
      cover.background = { color: "0F172A" };
      cover.addText("雙北基醫美拓展戰報", {
        x: 1.0, y: 2.0, w: 8.5, h: 1.2,
        fontSize: 36, bold: true, color: "38BDF8"
      });
      cover.addText(`責任目標轄區：${scopeTag}  |  產出日期：${todayTag}\n當前管線顯示診所總數：${list.length} 家`, {
        x: 1.0, y: 3.4, w: 8.5, h: 1.0,
        fontSize: 18, color: "CBD5E1"
      });

      for (let i = 0; i < list.length; i += 2) {
        const slide = pptx.addSlide();
        slide.background = { color: "1E293B" };
        
        slide.addText(`業務探勘戰情卡片 - ${scopeTag} (${i + 1}~${Math.min(i + 2, list.length)} / 共 ${list.length} 家)`, {
          x: 0.8, y: 0.4, w: 8.5, h: 0.5,
          fontSize: 14, color: "94A3B8", bold: true
        });

        for (let j = 0; j < 2; j++) {
          const item = list[i + j];
          if (!item) break;

          const posX = j === 0 ? 0.8 : 5.2;
          const isExisting = item.clientType === 'existing';
          
          slide.addShape(pptx.ShapeType.roundRect, {
            x: posX, y: 1.0, w: 4.1, h: 4.1,
            fill: { color: "0F172A" },
            line: { color: isExisting ? "FACC15" : "334155", width: isExisting ? 2 : 1.5 },
            rectRadius: 0.1
          });

          const clientTypeLabel = isExisting ? '[⭐ 既有客戶]' : '[🎯 陌開客戶]';
          slide.addText(`${clientTypeLabel} ${item.name}`, {
            x: posX + 0.2, y: 1.2, w: 3.7, h: 0.6,
            fontSize: 15, bold: true, color: isExisting ? "FACC15" : "38BDF8"
          });

          const stageText = isExisting ? '常態耗材巡補/擴機評估' : (statusNames[item.status] || item.status);
          slide.addText(`推進階段：${stageText}\n地址：${item.address || '未註明'}`, {
            x: posX + 0.2, y: 1.8, w: 3.7, h: 0.7,
            fontSize: 11, color: "CBD5E1"
          });

          slide.addText(`現有機台/耗材：\n${item.equipment || '未註明'}`, {
            x: posX + 0.2, y: 2.6, w: 3.7, h: 0.7,
            fontSize: 11, color: "38BDF8", bold: true
          });

          slide.addText(`戰情策略備忘：\n${item.notes || '無'}`, {
            x: posX + 0.2, y: 3.4, w: 3.7, h: 1.0,
            fontSize: 10, color: "E2E8F0"
          });

          const visitInfo = `拜訪日: ${item.lastVisitDate || '未記錄'}  |  預計複訪: ${item.followUpDate || '未設定'}`;
          slide.addText(visitInfo, {
            x: posX + 0.2, y: 4.6, w: 3.7, h: 0.4,
            fontSize: 9, color: "94A3B8"
          });
        }
      }

      pptx.writeFile({ fileName: `醫美業務戰報_${scopeTag}_${todayTag}.pptx` });
    };

    window.startEditClinic = function(id) {
      const target = clinics.find(c => c.id === id);
      if (!target) return;

      document.getElementById('editingId').value = target.id;
      document.getElementById('lastVisitDate').value = target.lastVisitDate || '';
      document.getElementById('followUpDate').value = target.followUpDate || '';
      document.getElementById('clientType').value = target.clientType || 'prospect';
      document.getElementById('name').value = target.name;
      document.getElementById('address').value = target.address;
      document.getElementById('status').value = target.status || 'red';
      document.getElementById('equipment').value = target.equipment || '';
      document.getElementById('notes').value = target.notes || '';

      handleClientTypeChange();

      document.getElementById('formTitle').innerText = `✏️ 編輯：${target.name}`;
      document.getElementById('cancelEditBtn').style.display = 'block';

      const submitBtn = document.getElementById('submitBtn');
      submitBtn.innerText = '💾 儲存並同步至雲端';
      submitBtn.classList.add('btn-update');

      document.getElementById('sidebar').scrollTop = 160;
    };

    window.resetFormToCreate = function() {
      document.getElementById('editingId').value = '';
      document.getElementById('lastVisitDate').value = '';
      document.getElementById('clinicForm').reset();
      handleClientTypeChange();
      document.getElementById('formTitle').innerText = '⚔️ 建立與維護目標';
      document.getElementById('cancelEditBtn').style.display = 'none';

      const submitBtn = document.getElementById('submitBtn');
      submitBtn.innerText = '定位並同步至雲端';
      submitBtn.classList.remove('btn-update');
    };

    document.getElementById('clinicForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const editingId = document.getElementById('editingId').value;
      const submitBtn = document.getElementById('submitBtn');
      const address = document.getElementById('address').value;
      const name = document.getElementById('name').value;
      const clientType = document.getElementById('clientType').value;
      const followUpDate = document.getElementById('followUpDate').value;
      const detectedDistrict = detectDistrict(address);

      const today = new Date();
      const todayStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;

      if (editingId) {
        const target = clinics.find(c => c.id === editingId);
        if (target) {
          const updatedClinic = {
            ...target,
            clientType: clientType,
            name: name,
            address: address,
            district: detectedDistrict,
            status: clientType === 'existing' ? 'purple' : document.getElementById('status').value,
            equipment: document.getElementById('equipment').value,
            notes: document.getElementById('notes').value,
            lastVisitDate: todayStr,
            followUpDate: followUpDate
          };
          
          await clinicsRef.child(editingId).set(updatedClinic);
          map.closePopup();
          resetFormToCreate();
        }
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerText = '正在定位並儲存雲端...';

      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(address)}`);
        const data = await res.json();

        if (data && data.length > 0) {
          const newId = 'c_' + Date.now();
          const lat = parseFloat(data[0].lat);
          const lng = parseFloat(data[0].lon);

          const newClinic = {
            id: newId,
            clientType: clientType,
            district: detectedDistrict,
            name: name,
            address: address,
            lat: lat,
            lng: lng,
            status: clientType === 'existing' ? 'purple' : document.getElementById('status').value,
            equipment: document.getElementById('equipment').value,
            notes: document.getElementById('notes').value,
            lastVisitDate: todayStr,
            followUpDate: followUpDate
          };

          await clinicsRef.child(newId).set(newClinic);
          
          if (currentDistrict !== 'ALL' && currentDistrict !== detectedDistrict) {
            document.getElementById('districtFilter').value = detectedDistrict;
            currentDistrict = detectedDistrict;
          }

          map.setView([lat, lng], 16);
          e.target.reset();
        } else {
          alert('找不到這個地址，請確認有填寫行政區與正確路名！');
        }
      } catch (err) {
        alert('連線失敗，請檢查網路連線。');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = '定位並同步至雲端';
      }
    });

    window.deleteClinic = function(id) {
      if (confirm('確定要從雲端永久移除這家診所嗎？')) {
        clinicsRef.child(id).remove();
      }
    };

    document.getElementById('districtFilter').value = '板橋區';
  </script>
</body>
</html>
