    .dash-score span { font-size: 12px; color: #64748b; font-weight: normal; }

<body>

      <div class="filter-row">
        <div>

          </select>
        </div>
        <div>
          <label>行政責任轄區</label>
          <select id="districtFilter" class="filter-select" onchange="applyFilters(true)">
            <option value="ALL">🌐 全責任區顯示</option>
            <option value="板橋區">板橋區</option>
            <option value="新莊區">新莊區</option>
            <option value="中和區">中和區</option>
            <option value="永和區">永和區</option>
            <option value="三重區">三重區</option>
            <option value="林口區">林口區</option>
            <option value="基隆市">基隆市</option>
            <option value="信義區">信義區 (台北)</option>
            <option value="大安區">大安區 (台北)</option>
            <option value="中山區">中山區 (台北)</option>
            <option value="中正區">中正區 (台北)</option>
            <option value="內湖區">內湖區 (台北)</option>
            <option value="南港區">南港區 (台北)</option>
            <option value="松山區">松山區 (台北)</option>
            <option value="蘆洲區">蘆洲區</option>
            <option value="土城區">土城區</option>
            <option value="新店區">新店區</option>
            <option value="淡水區">淡水區</option>
            <option value="汐止區">汐止區</option>
            <option value="三峽區">三峽區</option>
            <option value="鶯歌區">鶯歌區</option>
            <option value="樹林區">樹林區</option>
            <option value="泰山區">泰山區</option>

            <option value="八里區">八里區</option>
            <option value="其他">其他區域</option>

      </div>

      <div class="filter-full">
        <label>推進階段篩選（僅限陌開客戶）</label>
        <select id="statusFilter" class="filter-select" onchange="applyFilters()">
          <option value="ALL">🌈 全部階段顯示</option>
          <option value="red">🔴 未探勘 / 迷霧防禦</option>
          <option value="yellow">🟡 初訪摸底（DM留置/競品盤點）</option>
          <option value="orange">🟠 鎖定對話（取得院長/店長窗口）</option>
          <option value="green">🟢 評估試機（DEMO/提報報價）</option>
          <option value="purple">🟣 合作結案（已成交/常態維護）</option>
        </select>
      </div>

      <div class="export-btn-row">
        <button type="button" class="btn-export-excel" onclick="exportToExcel()">📊 匯出 Excel (.xlsx)</button>
        <button type="button" class="btn-export-ppt" onclick="exportToPPT()">📑 匯出簡報 (.pptx)</button>
      </div>
    </div>

    <!-- 智慧複訪提醒看板（7天內即將到期/逾期） -->
    <div id="reminderPanel">
      <div class="reminder-header" onclick="toggleReminderList()">
        <div class="reminder-title">
          <span>🔔 近7天拜訪追蹤</span>
          <span class="reminder-badge" id="reminderCount">0</span>
        </div>
        <span id="reminderArrow" style="font-size:11px; color:#94a3b8;">▼ 展開</span>
      </div>
      <div class="reminder-list" id="reminderList" style="display:none;"></div>
    </div>

    <div class="dashboard">
      <div class="dash-header">
        <div class="dash-title" id="currentScopeTitle">📍 板橋區戰情進度</div>
        <div class="dash-sync" id="syncStatus">🟢 雲端同步完成</div>
      </div>
      <div class="dash-score" id="totalCount">0 <span>家顯示中</span></div>
      <div class="progress-bar" id="progressBar" title="點擊進度條可依比例快速篩選陌開階段"></div>
    </div>

    <div class="form-header">
      <h2 id="formTitle">⚔️ 建立與維護目標</h2>
      <button type="button" id="cancelEditBtn" class="cancel-edit-btn" onclick="resetFormToCreate()">取消編輯</button>
    </div>

    <form id="clinicForm">
      <input type="hidden" id="editingId" value="">
      <input type="hidden" id="lastVisitDate" value="">

      <div class="form-group">
        <label>客戶屬性</label>
        <select id="clientType" onchange="handleClientTypeChange()">
          <option value="prospect">🎯 陌開客戶（主攻設備推展）</option>
          <option value="existing">⭐ 既有客戶（耗材巡補 / 擴機需求）</option>
        </select>
      </div>

      <div class="form-group">
        <label>診所名稱</label>
        <input type="text" id="name" placeholder="例如：板橋光澤診所" required>
      </div>
      <div class="form-group">
        <label>診所地址</label>
        <input type="text" id="address" placeholder="例如：新北市板橋區館前東路2號" required>
      </div>

      <div class="form-group" id="statusFormGroup">
        <label>推進階段（戰情色號）</label>
        <select id="status">
          <option value="red">🔴 未探勘 / 迷霧防禦</option>
          <option value="yellow">🟡 初訪摸底（DM留置/競品盤點）</option>
          <option value="orange">🟠 鎖定對話（取得院長/店長窗口）</option>
          <option value="green">🟢 評估試機（DEMO/提報報價）</option>
          <option value="purple">🟣 合作結案（已成交/常態維護）</option>
        </select>
      </div>

      <div class="form-group">
        <label>現有機台 / 競品與耗材需求</label>
        <input type="text" id="equipment" placeholder="例如：海芙三代、玩美電波、探頭耗材量大">
      </div>

      <div class="form-group">
        <label>🔔 預計複訪日期（選填）</label>
        <input type="date" id="followUpDate">
        <div class="quick-date-row">
          <button type="button" class="quick-date-btn" onclick="setQuickDate(3)">+3天</button>
          <button type="button" class="quick-date-btn" onclick="setQuickDate(7)">+7天(下週)</button>
          <button type="button" class="quick-date-btn" onclick="setQuickDate(14)">+14天(兩週)</button>
          <button type="button" class="quick-date-btn" onclick="document.getElementById('followUpDate').value=''" style="color:#94a3b8;">清除</button>
        </div>
      </div>

      <div class="form-group">
        <label>戰情情報與下一步策略</label>
        <textarea id="notes" rows="3" placeholder="例如：店長已換人，下週二預約提報新機台"></textarea>
      </div>
      <button type="submit" id="submitBtn" class="btn-primary">定位並同步至雲端</button>
    </form>

    <div class="legend">
      <div style="font-weight: bold; margin-bottom: 6px; color:#94a3b8;">階段色標與圖例（所有標記皆可自由拖曳微調）：</div>
      <div class="legend-grid">
        <div class="legend-item" onclick="quickFilterStatus('red')">🔴 未探勘 / 迷霧</div>
        <div class="legend-item" onclick="quickFilterStatus('yellow')">🟡 初訪摸底</div>
        <div class="legend-item" onclick="quickFilterStatus('orange')">🟠 鎖定對話窗口</div>
        <div class="legend-item" onclick="quickFilterStatus('green')">🟢 評估試機 / 報價</div>
        <div class="legend-item" onclick="quickFilterStatus('purple')">🟣 陌開結案</div>
        <div class="legend-item" style="cursor:default;"><span style="display:inline-flex; align-items:center; justify-content:center; width:17px; height:17px; background:#0f172a; border:1.5px solid #eab308; border-radius:50%; font-size:10px; color:#facc15;">⭐</span> 既有客戶 (黑金星鑽)</div>
      </div>
    </div>
  </div>

  <div id="map"></div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAuYp6stsPabpFZKJsHnCEAlmyM8LAgC_Q",
      authDomain: "clinic-crm-3048c.firebaseapp.com",
      databaseURL: "https://clinic-crm-3048c-default-rtdb.firebaseio.com",
      projectId: "clinic-crm-3048c",
      storageBucket: "clinic-crm-3048c.firebasestorage.app",
      messagingSenderId: "288594212887",
      appId: "1:288594212887:web:c22ed957992fb722fe4452"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const clinicsRef = db.ref('clinics');

    const districtCoords = {
      'ALL': { center: [25.065, 121.555], zoom: 11 },
      '板橋區': { center: [25.0135, 121.4645], zoom: 14 },
      '新莊區': { center: [25.0375, 121.4485], zoom: 14 },
      '中和區': { center: [24.9985, 121.5005], zoom: 14 },
      '永和區': { center: [25.0085, 121.5155], zoom: 15 },
      '三重區': { center: [25.0685, 121.4885], zoom: 14 },
      '林口區': { center: [25.0785, 121.3715], zoom: 14 },
      '基隆市': { center: [25.1315, 121.7435], zoom: 14 },
      '信義區': { center: [25.0335, 121.5685], zoom: 14 },
      '大安區': { center: [25.0265, 121.5435], zoom: 14 },
      '中山區': { center: [25.0625, 121.5335], zoom: 14 },
      '中正區': { center: [25.0325, 121.5185], zoom: 14 },
      '內湖區': { center: [25.0835, 121.5945], zoom: 13 },
      '南港區': { center: [25.0555, 121.6065], zoom: 14 },
      '松山區': { center: [25.0595, 121.5585], zoom: 14 },
      '蘆洲區': { center: [25.0855, 121.4725], zoom: 14 },
      '土城區': { center: [24.9725, 121.4435], zoom: 14 },
      '新店區': { center: [24.9685, 121.5415], zoom: 13 },
      '淡水區': { center: [25.1725, 121.4435], zoom: 13 },
      '汐止區': { center: [25.0655, 121.6565], zoom: 13 },
      '三峽區': { center: [24.9335, 121.3735], zoom: 13 },
      '鶯歌區': { center: [24.9545, 121.3555], zoom: 14 },
      '樹林區': { center: [24.9915, 121.4245], zoom: 14 },
      '泰山區': { center: [25.0585, 121.4315], zoom: 14 },
      '五股區': { center: [25.0835, 121.4385], zoom: 14 },
      '八里區': { center: [25.1485, 121.3985], zoom: 13 }
    };

    const colorMap = {
      red: '#ef4444',
      yellow: '#eab308',
      orange: '#f97316',
      green: '#22c55e',
      purple: '#a855f7'
    };

    const statusNames = {
      red: '🔴 未探勘/迷霧',
      yellow: '🟡 初訪摸底',
      orange: '🟠 鎖定窗口',
      green: '🟢 評估試機',
      purple: '🟣 合作結案'
    };

    let clinics = [];
    let currentDistrict = '板橋區';
    let currentClientType = 'ALL';
    let currentStatusFilter = 'ALL';
    let searchQuery = '';
    let markers = [];

    const map = L.map('map').setView([25.0135, 121.4645], 14);

    L.tileLayer('https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // 乾淨監聽，絕不再強制覆蓋手動拖曳成果
    clinicsRef.on('value', (snapshot) => {
      const data = snapshot.val();
      if (!data) {
        clinics = [];
        renderMap();
        checkFollowUpReminders();
        return;
      }

      // 如果資料庫裡的劉仲彥還停在松柏街舊點，第一次啟動時幫忙拉回雙十路屋頂（一次性校正）
      if (data["bq_22"] && Math.abs(data["bq_22"].lat - 25.02925) > 0.001) {
        clinicsRef.child("bq_22").update({ lat: 25.02925, lng: 121.47465 });
      }

      clinics = Object.values(data).map(item => ({
        ...item,
        clientType: item.clientType || 'prospect',
        lastVisitDate: item.lastVisitDate || '',
        followUpDate: item.followUpDate || ''
      }));
      
      renderMap();
      checkFollowUpReminders();
      document.getElementById('syncStatus').innerText = '🟢 雲端同步完成';
    });

    function detectDistrict(addr) {
      if (addr.includes('基隆')) return '基隆市';
      const districts = [
        '板橋區', '新莊區', '中和區', '永和區', '三重區', '林口區', '蘆洲區', '土城區', '新店區', '淡水區', '汐止區', '三峽區', '鶯歌區', '樹林區', '泰山區', '五股區', '八里區',
        '信義區', '大安區', '中山區', '中正區', '內湖區', '南港區', '松山區', '士林區', '北投區', '萬華區', '文山區', '大同區'
      ];
      for (let d of districts) {
        if (addr.includes(d) || addr.includes(d.replace('區', ''))) return d;
      }
      return '其他';
    }

      document.getElementById('followUpDate').value = `${yyyy}-${mm}-${dd}`;

    window.handleClientTypeChange = function() {
      const clientType = document.getElementById('clientType').value;
      const statusGroup = document.getElementById('statusFormGroup');
      if (clientType === 'existing') {
        statusGroup.style.display = 'none';
      } else {
        statusGroup.style.display = 'block';
      }

    function checkFollowUpReminders() {
      const today = new Date();
      today.setHours(0, 0, 0, 0);

      const reminderPanel = document.getElementById('reminderPanel');
      const reminderList = document.getElementById('reminderList');
      const reminderCount = document.getElementById('reminderCount');
      
      reminderList.innerHTML = '';
      const pendingItems = [];

      clinics.forEach(c => {
        if (!c.followUpDate) return;
        const [y, m, d] = c.followUpDate.split('-').map(Number);
        const fDate = new Date(y, m - 1, d);
        fDate.setHours(0, 0, 0, 0);

        const diffDays = Math.round((fDate - today) / (1000 * 60 * 60 * 24));

        if (diffDays <= 7) {
          pendingItems.push({
            clinic: c,
            diffDays: diffDays
          });
        }
      });

      pendingItems.sort((a, b) => a.diffDays - b.diffDays);

      if (pendingItems.length === 0) {
        reminderPanel.style.display = 'none';
        return;
      }

      reminderPanel.style.display = 'block';
      reminderCount.innerText = pendingItems.length;

      pendingItems.forEach(item => {
        const c = item.clinic;
        let borderClass = 'rem-upcoming';
        let tagClass = 'tag-upcoming';
        let statusText = `${item.diffDays}天後到期`;

        if (item.diffDays < 0) {
          borderClass = 'rem-overdue';
          tagClass = 'tag-overdue';
          statusText = `已逾期 ${Math.abs(item.diffDays)} 天`;
        } else if (item.diffDays === 0) {
          borderClass = 'rem-today';
          tagClass = 'tag-today';
          statusText = `今日預計拜訪`;
        }

        const div = document.createElement('div');
        div.className = `reminder-item ${borderClass}`;
        div.onclick = () => focusOnClinic(c.id);
        div.innerHTML = `
          <div>
            <strong style="color:#f1f5f9;">${c.name}</strong>
            <span style="font-size:11px; color:#94a3b8; margin-left:4px;">(${c.district})</span>
          </div>
          <span class="rem-tag ${tagClass}">${statusText}</span>
        `;
        reminderList.appendChild(div);
      });
    }

    window.toggleReminderList = function() {
      const list = document.getElementById('reminderList');
      const arrow = document.getElementById('reminderArrow');
      if (list.style.display === 'none') {
        list.style.display = 'flex';

    window.focusOnClinic = function(id) {
      const target = clinics.find(c => c.id === id);
      if (!target) return;

      if (currentDistrict !== 'ALL' && currentDistrict !== target.district) {
        document.getElementById('districtFilter').value = target.district;
        currentDistrict = target.district;
        renderMap();
      }

      map.setView([target.lat, target.lng], 16);
      setTimeout(() => {
        const marker = markers.find(m => {
          const latLng = m.getLatLng();
          return Math.abs(latLng.lat - target.lat) < 0.0001 && Math.abs(latLng.lng - target.lng) < 0.0001;
        });
        if (marker) marker.openPopup();
      }, 100);
    };

    function getFilteredClinics() {
      return clinics.filter(item => {
        const isExisting = item.clientType === 'existing';
        const matchDistrict = (currentDistrict === 'ALL') || (item.district === currentDistrict);
        const matchClient = (currentClientType === 'ALL') || (item.clientType === currentClientType);
        const matchStatus = isExisting ? true : ((currentStatusFilter === 'ALL') || (item.status === currentStatusFilter));
        
        const matchSearch = !searchQuery || 
          (item.name && item.name.toLowerCase().includes(searchQuery)) ||
          (item.address && item.address.toLowerCase().includes(searchQuery)) ||
          (item.equipment && item.equipment.toLowerCase().includes(searchQuery)) ||
          (item.notes && item.notes.toLowerCase().includes(searchQuery)) ||
          (item.lastVisitDate && item.lastVisitDate.includes(searchQuery)) ||
          (item.followUpDate && item.followUpDate.includes(searchQuery));

        return matchDistrict && matchClient && matchStatus && matchSearch;
      });
    }

                background: radial-gradient(circle at 30% 30%, #334155, #0f172a);

                border-radius: 50%;

        marker.on('dragend', function(e) {

        const lastVisitText = item.lastVisitDate ? `📅 上次拜訪：${item.lastVisitDate}` : '📅 上次拜訪：尚未記錄';
        const followUpText = item.followUpDate ? `🔔 預計複訪：${item.followUpDate}` : '';

        const popupContent = `
          <div style="font-size:13px; min-width: 220px;">
            <span class="client-badge ${badgeClass}">${badgeLabel}</span>
            <div style="font-size:11px; color:#38bdf8; font-weight:bold;">${item.district || '責任轄區'}</div>
            <strong style="font-size:15px;">${item.name}</strong><br>
            <span style="font-size:12px; color:#94a3b8;">${item.address || ''}</span><br>
            
            <div class="popup-date-box">
              <div style="color: #cbd5e1;">${lastVisitText}</div>
              ${followUpText ? `<div style="color: #facc15; font-weight:bold; margin-top:2px;">${followUpText}</div>` : ''}
            </div>

            ${!isExisting ? `<b style="color:#38bdf8;">推進階段：</b>${statusNames[item.status] || item.status}<br>` : ''}
            <b style="color:#38bdf8;">機台/耗材：</b>${item.equipment || '未註明'}<br>
            <b style="color:#38bdf8;">戰情：</b>${item.notes || '無'}<br>
            
            <div class="popup-btn-row">
              <button class="popup-btn" onclick="startEditClinic('${item.id}')" style="background:#2563eb; color:white;">✏️ 編輯情報</button>

    function updateStats(filteredList) {
      const scopeName = currentDistrict === 'ALL' ? '全責任區' : currentDistrict;
      document.getElementById('currentScopeTitle').innerText = `📍 ${scopeName} 戰情進度`;
      document.getElementById('totalCount').innerHTML = `${filteredList.length} <span>家顯示中</span>`;
      
      const bar = document.getElementById('progressBar');
      bar.innerHTML = '';
      
      const prospectList = filteredList.filter(c => c.clientType !== 'existing');
      if (prospectList.length === 0) return;

      const counts = { red: 0, yellow: 0, orange: 0, green: 0, purple: 0 };
      prospectList.forEach(c => counts[c.status] = (counts[c.status] || 0) + 1);

      for (let s in counts) {
        if (counts[s] > 0) {
          const seg = document.createElement('div');
          seg.className = `prog-${s}`;
          seg.style.width = `${(counts[s] / prospectList.length) * 100}%`;
          seg.title = `陌開階段 (${counts[s]} 家)`;
          seg.onclick = (e) => {
            e.stopPropagation();
            quickFilterStatus(s);
          };
          bar.appendChild(seg);
        }
      }
    }

    async function smartGeocode(name, rawAddress, detectedDistrict) {
      const twLock = '&countrycodes=tw';

      let clean = rawAddress.replace(/.{1,3}[里村鄰]/g, '').trim();
      let pureStreetNumber = clean.replace(/\d+[樓fF-].*/g, '').trim();

      // 優先序 1：完整門牌查詢
      try {
        let res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(pureStreetNumber)}${twLock}`);
        let data = await res.json();
        if (data && data.length > 0) return { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon) };
      } catch(e) {}

      // 優先序 2：店名 + 行政區查詢
      if (name) {
        const queryName = `${detectedDistrict !== '其他' ? detectedDistrict : ''} ${name}`.trim();
        try {
          let res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(queryName)}${twLock}`);
          let data = await res.json();
          if (data && data.length > 0) return { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon) };
        } catch(e) {}
      }

      // 優先序 3：同行政區路段吸附
      let streetOnly = pureStreetNumber.replace(/\d+.*[號].*/g, '').trim();
      if (streetOnly && streetOnly !== pureStreetNumber) {
        try {
          let res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(streetOnly)}${twLock}`);
          let data = await res.json();
          if (data && data.length > 0) return { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon) };
        } catch(e) {}
      }

      // 優先序 4：跨區穿透容錯
      const districtMatch = pureStreetNumber.match(/(台北市|新北市|基隆市)(.+?[區市鄉鎮])(.+)/);
      if (districtMatch) {
        const cityAndStreet = `${districtMatch[1]} ${districtMatch[3]}`;
        try {
          let res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(cityAndStreet)}${twLock}`);
          let data = await res.json();
          if (data && data.length > 0) return { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon) };
        } catch(e) {}
      }

      return null;
    }

    document.getElementById('clinicForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const editingId = document.getElementById('editingId').value;
      const submitBtn = document.getElementById('submitBtn');
      const address = document.getElementById('address').value.trim();
      const name = document.getElementById('name').value.trim();
      const clientType = document.getElementById('clientType').value;
      const followUpDate = document.getElementById('followUpDate').value;
      const detectedDistrict = detectDistrict(address);

      const today = new Date();
      const todayStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;

      if (editingId) {
        const target = clinics.find(c => c.id === editingId);
        if (target) {
          const updatedClinic = {
            ...target,
            clientType: clientType,
            name: name,
            address: address,
            district: detectedDistrict,
            status: clientType === 'existing' ? 'purple' : document.getElementById('status').value,
            equipment: document.getElementById('equipment').value,
            notes: document.getElementById('notes').value,
            lastVisitDate: todayStr,
            followUpDate: followUpDate
          };
          
          await clinicsRef.child(editingId).set(updatedClinic);
          map.closePopup();
          resetFormToCreate();
        }
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerText = '正在嚴格依轄區定位中...';

      try {
        const coords = await smartGeocode(name, address, detectedDistrict);

        if (coords) {
          const newId = 'c_' + Date.now();
          const newClinic = {
            id: newId,
            clientType: clientType,
            district: detectedDistrict,
            name: name,
            address: address,
            lat: coords.lat,
            lng: coords.lng,
            status: clientType === 'existing' ? 'purple' : document.getElementById('status').value,
            equipment: document.getElementById('equipment').value,
            notes: document.getElementById('notes').value,
            lastVisitDate: todayStr,
            followUpDate: followUpDate
          };

          await clinicsRef.child(newId).set(newClinic);
          
          if (currentDistrict !== 'ALL' && currentDistrict !== detectedDistrict) {
            document.getElementById('districtFilter').value = detectedDistrict;
            currentDistrict = detectedDistrict;
          }

          map.setView([coords.lat, coords.lng], 16);
          e.target.reset();
        } else {
          alert('找不到這個地址，請確認路名與門牌填寫是否正確！');
        }
      } catch (err) {
        alert('連線失敗，請檢查網路連線。');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = '定位並同步至雲端';
      }
    });

    window.deleteClinic = function(id) {
      if (confirm('確定要從雲端永久移除這家診所嗎？')) {
        clinicsRef.child(id).remove();
      }
    };

    document.getElementById('districtFilter').value = '板橋區';
  </script>
